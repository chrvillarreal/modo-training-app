<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modo Training 1.3 · Laboratorio</title>
<style>:root{font-family:system-ui,sans-serif;color:#e9f1f2;background:#10191e}*{box-sizing:border-box}body{margin:0}header{padding:22px;background:#18252b;border-bottom:1px solid #34434b}h1{margin:0;font-size:25px}small,p{color:#a7b7bf}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}button,select,input,textarea{font:inherit;border-radius:9px;padding:10px;background:#22323a;border:1px solid #45555d;color:white}button{cursor:pointer}.active,.primary{background:#c2ff49;color:#132018;border-color:#c2ff49;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#1a292f;border:1px solid #34434b;border-radius:14px;padding:17px;margin:10px 0}.metric{font-size:30px;font-weight:800;color:#c2ff49}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#a7b7bf}label{display:block;margin:9px 0 4px}input{width:100%}.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{display:inline-block;padding:5px 10px;background:#34434b;border-radius:99px;font-size:12px}.notice{border-left:4px solid #c2ff49;padding:12px;background:#26332a}progress{width:100%;accent-color:#c2ff49}a{color:#c2ff49}@media(max-width:520px){main{padding:12px}.sets{grid-template-columns:repeat(3,minmax(0,1fr))}input{min-width:0}}</style></head>
<body><header><h1>Modo Training <span style="color:#c2ff49">1.3</span></h1><small>Laboratorio independiente · Datos locales de demostración · Sin conexión a producción</small></header><main><nav class="bar" id="nav"></nav><section id="screen"></section></main>
<script>
const KEY='mt13_demo';const seed={athletes:[{id:1,name:'Lucía Fernández',goal:'Hipertrofia',sessions:[{date:'2026-10-05',done:true},{date:'2026-10-07',done:true},{date:'2026-10-09',done:false}]},{id:2,name:'Martín Gómez',goal:'Fuerza',sessions:[{date:'2026-10-05',done:true},{date:'2026-10-07',done:false}]}],exercises:[{id:1,name:'Sentadilla goblet',sets:[{reps:10,kg:18,rir:2},{reps:10,kg:18,rir:2},{reps:10,kg:18,rir:2}]},{id:2,name:'Press con mancuernas',sets:[{reps:12,kg:12,rir:2},{reps:12,kg:12,rir:2}]}],logs:[],notes:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}let page='dashboard',athlete=1,role='';state.assignments=state.assignments||{};function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function adherence(a){let due=a.sessions.filter(s=>s.date<=new Date().toISOString().slice(0,10));return due.length?Math.round(due.filter(s=>s.done).length/due.length*100):0}function nav(){document.getElementById('nav').innerHTML=role==='student'?'<button class="active">Alumno · Demo</button><button onclick="switchRole()">Cambiar perfil</button>':[['dashboard','Panel'],['athletes','Alumnos'],['plan','Planificación'],['student','Vista alumno'],['history','Historial']].map(([id,name])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+name+'</button>').join('')}function go(p){if(role==='student'&&!['student','history'].includes(p))return;page=p;render()}function switchRole(){role='';render()}function enterRole(r){role=r;page=r==='student'?'student':'dashboard';render()}function current(){return state.athletes.find(a=>a.id===athlete)}function assigned(){return state.assignments[athlete]}function assign(){state.assignments[athlete]={id:Date.now(),assignedAt:new Date().toISOString(),exercises:structuredClone(state.exercises)};save();render()}function choose(id){athlete=Number(id);render()}function render(){nav();const root=document.getElementById('screen');if(!role){root.innerHTML='<h2>Elegí un perfil para probar</h2><p>Ambos perfiles usan datos ficticios locales. No existe autenticación ni separación de permisos del servidor en esta demo.</p><div class="grid"><div class="card"><h3>Entrenador</h3><p>Administrá alumnos, rutinas, adherencia y notas.</p><button class="primary" onclick="enterRole(\'trainer\')">Entrar como entrenador</button></div><div class="card"><h3>Alumno</h3><p>Consultá tu sesión, registrá esfuerzo y revisá tu historial.</p><button class="primary" onclick="enterRole(\'student\')">Entrar como alumno</button></div></div>';return}if(page==='dashboard'){root.innerHTML='<h2>Panel del entrenador</h2><div class="grid"><div class="card"><small>Alumnos</small><div class="metric">'+state.athletes.length+'</div></div><div class="card"><small>Sesiones registradas en demo</small><div class="metric">'+state.logs.length+'</div></div><div class="card"><small>Adherencia media</small><div class="metric">'+Math.round(state.athletes.reduce((n,a)=>n+adherence(a),0)/state.athletes.length)+'%</div></div></div><h3>Seguimiento</h3>'+state.athletes.map(a=>'<div class="card row"><div><b>'+esc(a.name)+'</b><p>'+esc(a.goal)+' · Adherencia '+adherence(a)+'%</p><progress max="100" value="'+adherence(a)+'"></progress></div><button onclick="choose('+a.id+');go(\'athletes\')">Abrir ficha</button></div>').join('')}else if(page==='athletes'){root.innerHTML='<h2>Ficha del alumno</h2><select onchange="choose(this.value)">'+state.athletes.map(a=>'<option value="'+a.id+'" '+(a.id===athlete?'selected':'')+'>'+esc(a.name)+'</option>').join('')+'</select><div class="card"><h3>'+esc(current().name)+'</h3><p>Objetivo: '+esc(current().goal)+'</p><div class="metric">'+adherence(current())+'% adherencia</div><p>Calculada solo sobre sesiones con fecha vencida o actual.</p></div><h3>Calendario de sesiones</h3>'+current().sessions.map((s,i)=>'<div class="card row"><span>'+esc(s.date)+'</span><span class="pill">'+(s.done?'Completada':'Pendiente')+'</span><button onclick="toggle('+i+')">Cambiar estado (demo)</button></div>').join('')+'<h3>Rutina del alumno</h3><div class="card"><p>'+(assigned()?'Rutina asignada · '+assigned().exercises.length+' ejercicios':'Sin rutina asignada')+'</p><button class="primary" onclick="assign()">Asignar copia de rutina</button></div><h3>Notas del entrenador</h3><textarea id="note" rows="3" style="width:100%" placeholder="Observación privada de demostración"></textarea><button class="primary" onclick="addNote()">Guardar nota</button>'+state.notes.filter(n=>n.athlete===athlete).map(n=>'<div class="card">'+esc(n.text)+'</div>').join('')}else if(page==='plan'){root.innerHTML='<h2>Editor de sesión</h2><p>Series, repeticiones, carga y RIR. Los cambios de esta demo se guardan solo en este navegador.</p>'+state.exercises.map((e,i)=>'<div class="card"><h3>'+esc(e.name)+'</h3>'+e.sets.map((s,j)=>'<div class="sets"><label>Reps<input type="number" min="0" value="'+s.reps+'" onchange="setField('+i+','+j+',\'reps\',this.value)"></label><label>Kg<input type="number" min="0" step=".5" value="'+s.kg+'" onchange="setField('+i+','+j+',\'kg\',this.value)"></label><label>RIR<input type="number" min="0" max="10" value="'+s.rir+'" onchange="setField('+i+','+j+',\'rir\',this.value)"></label></div>').join('')+'<button onclick="addSet('+i+')">+ Serie</button></div>').join('')}else if(page==='student'){root.innerHTML='<h2>Entrenamiento del alumno</h2><div class="notice">Vista de demostración: los registros no se envían a ningún servidor.</div><p>Alumno: '+esc(current().name)+'</p>'+(assigned()?.exercises||[]).map(e=>'<div class="card"><h3>'+esc(e.name)+'</h3>'+e.sets.map((s,i)=>'<p>Serie '+(i+1)+': '+s.reps+' reps · '+s.kg+' kg · RIR '+s.rir+'</p>').join('')+'</div>').join('')+'<label>RPE percibido (1–10)<input id="rpe" type="number" min="1" max="10" value="7"></label><label>Duración (min)<input id="duration" type="number" min="1" value="45"></label><label>Sensaciones<textarea id="feeling" rows="3" style="width:100%"></textarea></label><button class="primary" onclick="complete()">Completar sesión demo</button>'}else{root.innerHTML='<h2>Historial de sesiones</h2>'+(!state.logs.length?'<p>Todavía no hay registros de sesiones en esta demo.</p>':state.logs.filter(l=>role==='trainer'||l.athleteId===athlete).slice().reverse().map(l=>'<div class="card"><b>'+esc(l.name)+'</b><p>'+esc(l.date)+' · '+l.duration+' min · RPE '+l.rpe+'</p><p>'+esc(l.feeling)+'</p><details><summary>Series registradas</summary>'+l.exercises.map(e=>'<p>'+esc(e.name)+': '+e.sets.map(s=>s.reps+'×'+s.kg+'kg (RIR '+s.rir+')').join(' · ')+'</p>').join('')+'</details></div>').join(''))}if(role==='trainer')root.innerHTML+='<button onclick="switchRole()">Cambiar perfil</button>';root.innerHTML+='<p class="muted"><small>Prototipo aislado: no representa el estado del backend Supabase descrito en el documento maestro.</small></p>'}function toggle(i){current().sessions[i].done=!current().sessions[i].done;save();render()}function setField(i,j,k,v){state.exercises[i].sets[j][k]=Number(v);save()}function addSet(i){let s=state.exercises[i].sets.at(-1);state.exercises[i].sets.push({...s});save();render()}function addNote(){let v=document.getElementById('note').value.trim();if(!v)return;state.notes.push({athlete,text:v});save();render()}function complete(){if(!assigned())return alert('No hay rutina asignada');let r=Number(document.getElementById('rpe').value),d=Number(document.getElementById('duration').value);if(r<1||r>10||d<=0||!Number.isFinite(r)||!Number.isFinite(d))return alert('Revisá el RPE y la duración');state.logs.push({athleteId:athlete,assignmentId:assigned().id,name:current().name,date:new Date().toISOString().slice(0,10),rpe:r,duration:d,feeling:document.getElementById('feeling').value,exercises:structuredClone(assigned().exercises)});save();go('history')}render();
</script></body></html>
