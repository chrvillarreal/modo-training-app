<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modo Training · Operaciones IA</title>
<style>
:root{font-family:system-ui,sans-serif;color:#edf4f4;background:#101a1f}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,calc((100vw - 1100px)/2));background:#19282e;border-bottom:1px solid #33454b}h1{margin:0;font-size:clamp(24px,4vw,34px)}p,.muted,small{color:#b4c2c6}main{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button.active,.primary{background:#b9ff45;color:#102018;border-color:#b9ff45}button,input,select,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #4b5d63;background:#25373d;color:#fff}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b9ff45;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}label{display:grid;gap:6px;font-weight:600;font-size:14px}input,select,textarea{width:100%;min-width:0}textarea{min-height:90px}.card{border:1px solid #33454b;background:#19282e;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.item{border-top:1px solid #405057;padding:14px 0}.item:first-child{border-top:0}.tag{display:inline-block;border-radius:20px;background:#33494b;padding:4px 9px;font-size:12px}.metric{font-size:30px;color:#b9ff45;font-weight:800}.danger{border-color:#9d5858}.sr{position:absolute;left:-10000px}a{color:#b9ff45}@media(max-width:560px){main{padding:12px}header{padding:18px 12px}}
</style></head><body><header><h1>Modo Training · Operaciones IA</h1><p>Laboratorio semiautomático · datos locales · sin envíos ni publicaciones automáticas</p></header><main><nav class="tabs" aria-label="Secciones"><button data-tab="dashboard" class="active">Resumen</button><button data-tab="prospects">Ventas</button><button data-tab="content">Marketing</button><button data-tab="tasks">Coordinación</button><button data-tab="backup">Respaldo</button></nav><div id="app" aria-live="polite"></div></main>
<script>
'use strict';
const KEY='modo_training_ai_ops_v1';
const empty=()=>({version:1,prospects:[],content:[],tasks:[]});
let state=load(),tab='dashboard';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return valid(x)?x:empty()}catch{return empty()}}
function valid(x){return x&&x.version===1&&['prospects','content','tasks'].every(k=>Array.isArray(x[k]))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('No se pudo guardar. Exportá una copia de seguridad.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function count(k,s){return state[k].filter(x=>x.status===s).length}
function buttons(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')})}
function render(){buttons();const a=document.getElementById('app');a.innerHTML=tab==='dashboard'?dashboard():tab==='prospects'?prospects():tab==='content'?content():tab==='tasks'?tasks():backup()}
function dashboard(){return '<div class="grid">'+[['Prospectos',state.prospects.length],['Contactos pendientes',count('prospects','pendiente')],['Borradores',count('content','borrador')],['Tareas abiertas',state.tasks.filter(x=>x.status!=='hecha').length]].map(([k,v])=>'<section class="card"><div class="metric">'+v+'</div><b>'+k+'</b></section>').join('')+'</div><section class="card"><h2>Modo supervisado</h2><p>Los agentes pueden preparar propuestas y tareas. Ningún mensaje, campaña o cambio de producción se ejecuta desde este panel.</p><p>Las aprobaciones son estados de trabajo, no disparadores de acciones externas.</p></section>'}
function prospects(){return '<section class="card"><h2>Nuevo prospecto</h2><form id="prospectForm" class="form"><label>Entrenador o marca<input name="name" required maxlength="100"></label><label>Canal / contacto<input name="channel" maxlength="150" placeholder="Instagram, correo o referencia"></label><label>Estado<select name="status"><option value="pendiente">Pendiente</option><option value="contactado">Contactado</option><option value="interesado">Interesado</option><option value="prueba">En prueba</option><option value="descartado">Descartado</option></select></label><label class="wide">Notas<textarea name="notes" maxlength="1000"></textarea></label><div class="wide"><button class="primary">Agregar prospecto</button></div></form></section><section class="card"><h2>Prospectos ('+state.prospects.length+')</h2>'+list('prospects')+'</section>'}
function content(){return '<section class="card"><h2>Nueva pieza de marketing</h2><form id="contentForm" class="form"><label>Título<input name="name" required maxlength="120"></label><label>Canal<select name="channel"><option>Instagram</option><option>WhatsApp</option><option>LinkedIn</option><option>Otro</option></select></label><label class="wide">Borrador<textarea name="notes" maxlength="5000" required></textarea></label><div class="wide"><button class="primary">Guardar borrador</button></div></form></section><section class="card"><h2>Calendario editorial / aprobaciones</h2><p class="muted">Las piezas aprobadas no se publican automáticamente.</p>'+list('content')+'</section>'}
function tasks(){return '<section class="card"><h2>Nueva tarea</h2><form id="taskForm" class="form"><label>Objetivo<input name="name" required maxlength="150"></label><label>Responsable<select name="channel"><option>Coordinador</option><option>Ventas</option><option>Marketing</option><option>Desarrollo</option></select></label><label>Prioridad<select name="priority"><option>Media</option><option>Alta</option><option>Baja</option></select></label><label class="wide">Detalle<textarea name="notes" maxlength="2000"></textarea></label><div class="wide"><button class="primary">Crear tarea</button></div></form></section><section class="card"><h2>Cola de trabajo</h2>'+list('tasks')+'</section>'}
function list(k){const rows=state[k];if(!rows.length)return '<p class="muted">Todavía no hay registros.</p>';return rows.map(x=>'<article class="item"><b>'+esc(x.name)+'</b> <span class="tag">'+esc(x.status)+'</span><p>'+esc(x.channel)+(x.priority?' · '+esc(x.priority):'')+'</p><p>'+esc(x.notes)+'</p><small>Creado: '+esc(x.created.slice(0,10))+'</small><div class="actions"><label>Estado<select data-kind="'+k+'" data-id="'+esc(x.id)+'">'+options(k,x.status)+'</select></label><button class="danger" data-delete="'+k+'" data-id="'+esc(x.id)+'">Eliminar</button></div></article>').join('')}
const statuses={prospects:['pendiente','contactado','interesado','prueba','descartado'],content:['borrador','revision','aprobado','rechazado'],tasks:['pendiente','en_curso','bloqueada','hecha']};
function options(k,v){return statuses[k].map(s=>'<option value="'+s+'"'+(s===v?' selected':'')+'>'+s.replaceAll('_',' ')+'</option>').join('')}
function backup(){return '<section class="card"><h2>Respaldo local</h2><p>Los datos permanecen en este navegador. Exportá copias periódicas; borrar los datos del navegador puede eliminarlos.</p><div class="actions"><button id="export">Exportar JSON</button><label>Importar respaldo JSON<input type="file" id="import" accept=".json,application/json"></label></div><p class="muted">Importar reemplaza los registros actuales, después de confirmar.</p></section>'}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}});
document.getElementById('app').addEventListener('submit',e=>{if(!e.target.matches('form'))return;e.preventDefault();const f=e.target,d=new FormData(f),k=f.id==='prospectForm'?'prospects':f.id==='contentForm'?'content':'tasks';state[k].unshift({id:id(),name:String(d.get('name')).trim(),channel:String(d.get('channel')||''),notes:String(d.get('notes')||''),priority:k==='tasks'?String(d.get('priority')):'',status:k==='prospects'?String(d.get('status')):k==='content'?'borrador':'pendiente',created:new Date().toISOString()});persist();render()});
document.getElementById('app').addEventListener('change',async e=>{const t=e.target;if(t.matches('select[data-kind]')){const x=state[t.dataset.kind].find(v=>v.id===t.dataset.id);if(x&&statuses[t.dataset.kind].includes(t.value)){x.status=t.value;persist();render()}}if(t.id==='import'){const file=t.files[0];if(!file)return;if(file.size>2000000){alert('Archivo demasiado grande');return}try{const x=JSON.parse(await file.text());if(!valid(x)||!['prospects','content','tasks'].every(k=>x[k].length<=10000&&x[k].every(v=>v&&typeof v.id==='string'&&typeof v.name==='string'&&typeof v.status==='string'&&statuses[k].includes(v.status))))throw Error('Formato inválido');if(confirm('¿Reemplazar todos los registros locales?')){state=x;persist();render()}}catch{alert('No se pudo importar el respaldo')}}});
document.getElementById('app').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.delete){if(confirm('¿Eliminar este registro?')){state[t.dataset.delete]=state[t.dataset.delete].filter(x=>x.id!==t.dataset.id);persist();render()}}if(t.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='modo-training-ops-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});
render();
</script></body></html>
